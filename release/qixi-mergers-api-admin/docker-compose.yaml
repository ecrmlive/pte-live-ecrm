name: qixi_mergers

services:
  api_admin:
    image: alpine:3.24.1
    container_name: qixi_mergers_api_admin
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./config/${QX_RELEASE_ENV:-local}/compose.env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${API_ADMIN_HOST_PORT:-18080}:8080"
    volumes:
      - ./bin/api-admin:/app/api-admin:ro
      - ./config/${QX_RELEASE_ENV:-local}/app.yaml:/app/conf/app.yaml:ro
    command: ["/app/api-admin", "-config", "/app/conf/app.yaml"]
    networks:
      qixi_mergers_net:
        ipv4_address: 172.30.80.20

networks:
  qixi_mergers_net:
    external: true
    name: qixi_mergers_net
