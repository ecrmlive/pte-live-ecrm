# 宿主机 Nginx · 本机开发
# 后台前端 → api-admin :18080；C 端 H5 → api-app :18085
#
#   make local-api-admin local-api-app
#   make local-admin local-merchant-admin local-h5 local-pc local-service-web

# —— 平台后台 → api-admin ——
server {
    listen 18081;
    server_name 127.0.0.1 localhost;
    root /Users/daniel/Documents/GitHub/qixi-live-mergers/release/qixi-mergers-admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

