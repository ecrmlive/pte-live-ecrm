# 基建：MySQL / Redis / etcd / MinIO；负责创建 qixi_mergers_net
name: qixi_mergers_db

services:
  mysql:
    image: mysql:8.4.10
    container_name: qixi_mergers_mysql
    restart: unless-stopped
    env_file:
      - ./config/${QX_RELEASE_ENV:-local}/compose.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qixi_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qixi_mergers}
      MYSQL_USER: ${MYSQL_USER:-qixi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qixi_local}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - qixi_mergers_mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      qixi_mergers_net:
        ipv4_address: 172.30.80.10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password

  redis:
    image: redis:8.8.0
    container_name: qixi_mergers_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - qixi_mergers_redis_data:/data
    networks:
      qixi_mergers_net:
        ipv4_address: 172.30.80.11
    command: ["redis-server", "--appendonly", "yes"]

  etcd:
    image: gcr.io/etcd-development/etcd:v3.7.0
    container_name: qixi_mergers_etcd
    restart: unless-stopped
    environment:
      ETCD_NAME: qixi_mergers_etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://qixi_mergers_etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://qixi_mergers_etcd:2380
      ETCD_INITIAL_CLUSTER: qixi_mergers_etcd=http://qixi_mergers_etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: qixi_mergers_etcd
      ETCD_INITIAL_CLUSTER_STATE: new
    ports:
      - "${ETCD_HOST_PORT:-12379}:2379"
    volumes:
      - qixi_mergers_etcd_data:/etcd-data
    networks:
      qixi_mergers_net:
        ipv4_address: 172.30.80.12

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: qixi_mergers_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qixi_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qixi_minio_secret}
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - qixi_mergers_minio_data:/data
    networks:
      qixi_mergers_net:
        ipv4_address: 172.30.80.14
    command: ["server", "/data", "--console-address", ":9001"]

networks:
  qixi_mergers_net:
    name: qixi_mergers_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  qixi_mergers_mysql_data:
  qixi_mergers_redis_data:
  qixi_mergers_etcd_data:
  qixi_mergers_minio_data:
