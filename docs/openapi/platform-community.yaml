openapi: 3.0.3
info:
  title: qixi-mergers platform community
  version: 0.6.7
  description: 平台社区种草审核（status 1 通过 / -1 驳回）
servers:
  - url: /api/platform/v1
paths:
  /community/posts:
    get:
      summary: 全量帖子（含待审）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
  /community/posts/{id}:
    get:
      summary: 详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
    delete:
      summary: 软删除帖子
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
  /community/posts/{id}/audit:
    post:
      summary: 审核 status=1 通过 / -1 驳回
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: integer, description: "1 通过 / -1 驳回" }
                refusal: { type: string }
                is_show: { type: integer }
                is_hot: { type: integer }
  /community/replies/{id}:
    delete:
      summary: 删除评论
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
  /community/categories:
    get:
      summary: 分类
  /community/topics:
    get:
      summary: 话题
