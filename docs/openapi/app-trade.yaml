openapi: 3.0.3
info:
  title: pte-live-ecrm app trade
  version: 0.7.0
  description: |
    阶段 3 交易主链。pay_type：0=balance，1=wechat，2=alipay，7=mock，8=integral。
    真实路径对齐 FUNCTIONAL-TRUTH：/v2/order/check|create、/order/pay/:id。
    平台自营商品仅使用平台加密配置；入驻商户商品仅使用所属店铺自己的加密配置，二者不共用。不同支付主体商品必须分别结算；客户端先读取支付方式，再发起支付。
    PC 微信支付使用 Native 下单，返回 code_url 由客户端生成二维码；小程序登录态使用 JSAPI 下单，
    返回由服务端签名的 uni.requestPayment 参数。两种支付成功都必须等待微信 v3 签名回调。
    回调同时校验 Wechatpay 签名、AES-256-GCM 资源、商户号、AppID、订单号和服务端实付金额，并以 provider_event_id 幂等落单。
    支付宝仍不开放，未完成前不会伪造支付成功。mock 仅允许显式启用的本地/测试环境。
    积分商城见 app-loyalty.yaml（/order/v3/*、/order/points/pay/:id）。
    禁止 stale：/order/create、/order/check、/order/v2/*、/v3/order/*。
servers:
  - url: /api/app/v1
paths:
  /address:
    get:
      summary: 地址列表
      description: 读取 qixi_crm_b_user_address，按默认地址优先排序。
      security: [{ bearerAuth: [] }]
    post:
      summary: 新增地址
      description: 收货人、手机号、详细地址必填；is_default=1 时在同一事务内取消同用户其他默认地址。
      security: [{ bearerAuth: [] }]
  /address/{id}:
    put: { summary: 更新地址, security: [{ bearerAuth: [] }] }
    delete: { summary: 删除地址, security: [{ bearerAuth: [] }] }
  /cart:
    get:
      summary: 购物车按商户分组
      description: >-
        仅读取 `qixi_crm_b_cart`、商品与店铺消费视图；响应中的 title 是商品名，store_name 是店铺名。
        入驻商户商品额外返回 merchant_app_id，客户端仅可用该值向服务端换发店铺上下文 JWT 后再改数量或删除。
      security: [{ bearerAuth: [] }]
    post:
      summary: 加购
      description: >-
        在业务库事务内校验商品消费视图的在售状态与库存；最终库存扣减由下单事务负责。
        入驻商户商品必须携带 X-AppId，且该值必须与服务端签发的店铺上下文 JWT 中 merchant_app_id、merchant_id、store_id 一致；仅伪造 X-AppId 会被拒绝。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-AppId
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
          description: 入驻商户商品必填；平台自营商品不使用该头。
  /cart/{id}:
    put: { summary: 改数量, security: [{ bearerAuth: [] }] }
    delete: { summary: 删除, security: [{ bearerAuth: [] }] }
  /v2/order/check:
    post:
      summary: 结算预览
      description: >-
        coupon_user_ids 可选择一张店铺券和一张平台券；服务端按店铺券、平台券顺序用整数分计算折扣，
        不信任客户端金额。
      security: [{ bearerAuth: [] }]
  /v2/order/create:
    post:
      summary: 创建主单+商户子单
      description: >-
        与结算预览使用相同 coupon_user_ids。建单事务会锁定券并保存实付金额；支付成功后券变为 used。
        已锁定但未支付订单的取消/超时解锁不由本接口处理，必须通过订单状态机完成。
      security: [{ bearerAuth: [] }]
  /order/pay/{id}:
    post:
      summary: 发起支付
      description: >-
        pay_type=wechat 且当前为 PC 时创建微信 Native 预下单并返回 payment_mode=native、code_url、expires_at；
        JWT 的 client_platform=mini_program 时使用该用户已绑定的 openid 创建 JSAPI 预下单，并返回
        payment_mode=jsapi、timeStamp、nonceStr、package、signType、paySign；客户端不得传入金额或 openid。
        不改变订单已支付状态。只有签名验证通过的微信回调才能将订单置为 paid。
      security: [{ bearerAuth: [] }]
  /order/pay/{id}/channels:
    get:
      summary: 查询订单可用支付方式
      description: 平台自营订单只校验平台配置；入驻商户订单只校验该店铺独立配置。不会在两套配置间回退。
      security: [{ bearerAuth: [] }]
  /orders:
    get: { summary: 用户主单列表, security: [{ bearerAuth: [] }] }
  /orders/{id}:
    get: { summary: 主单详情, security: [{ bearerAuth: [] }] }
  /orders/{id}/cancel:
    post:
      summary: 取消未支付主单
      description: 仅 pending 主单可取消；在同一事务内关闭子单并恢复该主单锁定的优惠券。
      security: [{ bearerAuth: [] }]
  /order/{id}:
    get: { summary: 商户子订单详情, security: [{ bearerAuth: [] }] }
  /invoices:
    get: { summary: 我的发票申请列表, security: [{ bearerAuth: [] }] }
    post: { summary: 提交发票申请, security: [{ bearerAuth: [] }] }
  /merchant-applications:
    post:
      summary: 提交商户入驻申请
      description: >-
        C 端仅写入 qixi_crm_business 的申请事实和业务 outbox；api-platform 通过 NATS
        投影到 qixi_crm_admin 的审核队列。营业执照字段为已完成 COS 直传后的 license_key，
        不接受 URL，也不允许客户端直写后台库。
      security: [{ bearerAuth: [] }]
  /uploads/presign:
    post:
      summary: 签发 C 端 COS PUT 直传地址
      description: >-
        仅签发 merchant_application_license 用途的 JPG、PNG、WebP 图片，10 分钟有效、最大 10MB。
        服务端不接收文件字节；响应只包含 object_key、PUT 地址、必需请求头和过期时间。
      security: [{ bearerAuth: [] }]
  /uploads/complete:
    post:
      summary: 校验 COS 对象并保存对象 Key
      description: >-
        客户端 PUT 成功后提交 object_key。服务端 HEAD 校验对象存在、核验当前用户和用途，
        再写 qixi_crm_b_upload_object；该 Key 才可用于入驻申请。
      security: [{ bearerAuth: [] }]
  /merchant-applications/mine:
    get:
      summary: 我的商户入驻申请
      security: [{ bearerAuth: [] }]
  /account/balance:
    get:
      summary: 我的余额与余额流水
      description: 仅读取 qixi_crm_b_member_account 与 qixi_crm_b_asset_ledger 的 balance 资产域。
      security: [{ bearerAuth: [] }]
  /account/points:
    get:
      summary: 我的积分与积分流水
      description: 仅读取 qixi_crm_b_member_account 与 qixi_crm_b_asset_ledger 的 points 资产域，积分始终按整数返回。
      security: [{ bearerAuth: [] }]
  /coupons/center:
    get:
      summary: 领券中心
      description: >-
        仅读取 qixi_crm_b_coupon_template_view；可用 mer_id 过滤某商户店铺券。
        平台券 store_id=0，店铺券按商户消费视图隔离。
      security: [{ bearerAuth: [] }]
  /coupons/{id}/receive:
    post:
      summary: 领取优惠券
      description: >-
        对同一用户和券模板幂等，写入 qixi_crm_b_coupon_user；已领时返回当前用户券。
      security: [{ bearerAuth: [] }]
  /coupons/mine:
    get:
      summary: 我的优惠券
      description: >-
        status=unused 或 0 时仅返回有效未使用券；status=history 或 used 时返回已使用、已过期券。
        未传 status 或 status=all 返回全部用户券。券模板过期时读取态按已过期返回，不在查询时修改用户券记录。
      security: [{ bearerAuth: [] }]
  /coupons/usable:
    get:
      summary: 当前购物车可用优惠券
      description: cart_ids 为逗号分隔购物车 ID；仅返回当前用户、有效期内且满足门槛的未使用平台券/当前店铺券。
      security: [{ bearerAuth: [] }]
  /favorites:
    get:
      summary: 我的商品或店铺收藏
      description: >-
        type=product 返回已收藏且仍在售的商品消费视图；type=store 返回已收藏且启用的店铺视图，
        并包含店铺当前 follower_count，供 PC 收藏页展示关注人数。
      security: [{ bearerAuth: [] }]
  /favorites/products/{id}:
    get: { summary: 查询商品收藏状态, security: [{ bearerAuth: [] }] }
    put: { summary: 收藏商品, security: [{ bearerAuth: [] }] }
    delete: { summary: 取消收藏商品, security: [{ bearerAuth: [] }] }
  /favorites/stores/{id}:
    get: { summary: 查询店铺收藏状态, security: [{ bearerAuth: [] }] }
    put: { summary: 收藏店铺, security: [{ bearerAuth: [] }] }
    delete: { summary: 取消收藏店铺, security: [{ bearerAuth: [] }] }
  /refund/apply:
    post:
      summary: 用户提交整单售后申请
      description: 仅允许本人已支付、履约中或已发货的订单；refund_type=1 为仅退款，refund_type=2 为退货退款。退货退款审核通过后，用户必须登记寄回物流，商户确认收货后才进入退款处理阶段；请求使用 idempotency_key 防重，创建后订单状态进入 aftersale。
      security: [{ bearerAuth: [] }]
  /refunds:
    get: { summary: 我的售后单列表, security: [{ bearerAuth: [] }] }
  /refunds/{id}:
    get: { summary: 售后单详情, security: [{ bearerAuth: [] }] }
  /refunds/{id}/cancel:
    post: { summary: 用户取消待处理售后申请, security: [{ bearerAuth: [] }] }
  /refunds/{id}/platform:
    post: { summary: 用户申请平台介入, security: [{ bearerAuth: [] }] }
  /refunds/{id}/return-shipment:
    post:
      summary: 用户登记退货物流
      description: 仅退货退款且处于 awaiting_return 时可提交一次承运商、运单号和备注；成功后进入 awaiting_receipt，不变更资金或库存。
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authori-zation
      description: "Bearer <JWT>；所有 JWT 请求只接受 Authori-zation，拒绝 Authorization。"
