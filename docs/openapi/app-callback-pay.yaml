openapi: 3.0.3
info:
  title: qixi-live-ecrm pay callback
  version: 0.2.0
  description: |
    支付回调前缀 /api/callback/v1（无 JWT）。
    微信回调：仅接受微信支付 v3 标准通知。先用 Wechatpay-* 头验签，再 AES-256-GCM 解密 resource，
    校验商户号、AppID、订单号与服务端金额，最后在 qixi_crm_business 内以 provider_event_id 幂等更新订单。
    mock 仅在显式启用 sandbox 时注册；支付宝真实回调尚未开放。
servers:
  - url: /api/callback/v1
paths:
  /ping:
    get:
      summary: 支付回调接口健康探测
  /pay/mock:
    post:
      summary: Mock 支付回调
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_order_id, uid]
              properties:
                group_order_id: { type: integer }
                uid: { type: integer }
  /pay/wechat:
    post:
      summary: 微信支付 v3 回调（无 JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, event_type, resource]
              properties:
                id: { type: string, description: 微信事件 ID，用于幂等 }
                event_type: { type: string, example: TRANSACTION.SUCCESS }
                resource: { type: object, description: 微信 AEAD_AES_256_GCM 加密资源 }
      parameters:
        - { name: Wechatpay-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Nonce, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Signature, in: header, required: true, schema: { type: string } }
        - { name: Wechatpay-Serial, in: header, required: true, schema: { type: string } }
components:
  schemas:
    ChannelNotify:
      type: object
      required: [group_order_id, uid, notify_token]
      properties:
        group_order_id: { type: integer }
        uid: { type: integer }
        out_trade_no: { type: string }
        pay_price: { type: number }
        notify_token: { type: string }
