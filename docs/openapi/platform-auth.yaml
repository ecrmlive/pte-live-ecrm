openapi: 3.0.3
info:
  title: qixi-mergers platform auth
  version: 0.1.0
  description: 阶段 1 平台后台身份接口（api-admin）
servers:
  - url: /api/platform/v1
paths:
  /auth/login:
    post:
      summary: 平台管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
  /auth/refresh:
    post:
      summary: 刷新 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: 当前管理员
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/menus:
    get:
      summary: 当前管理员菜单树
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/permissions:
    get:
      summary: 按钮权限 path 列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/password:
    put:
      summary: 修改密码
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
