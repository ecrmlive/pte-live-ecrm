openapi: 3.0.3
info:
  title: pte-live-ecrm unified admin customer service
  version: 1.0.0
  description: >-
    统一后台客服队列。仅 platform 角色或具有 customer_service 角色且已配置
    service_queue store_ids 数据范围的后台 JWT 可访问。IM 消息、UserSig 和 WebSocket
    不由本契约代理，继续由 pte-live-im 按当前商户 IM SDK AppID 提供。
servers:
  - url: /api/platform/v1
paths:
  /customer-service/threads:
    get:
      summary: 查询获授权店铺的客服会话队列
      security: [{ authorization: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: status, schema: { type: string, enum: [open, closed] } }
        - { in: query, name: mine, schema: { type: integer, enum: [0, 1] } }
      responses:
        '200': { description: 客服会话分页，含该商户当前 IM SDK AppId 快照（不含 UserSig） }
        '403': { description: 无 customer_service 角色或无 service_queue 数据范围 }
  /customer-service/threads/{id}:
    get:
      summary: 查询单个获授权客服会话元数据
      security: [{ authorization: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 客服会话元数据；不含 IM 消息或凭据 }
        '404': { description: 不存在或不在当前数据范围 }
  /customer-service/threads/{id}/claim:
    post:
      summary: 领取开放的客服会话
      security: [{ authorization: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 领取成功 }
        '409': { description: 会话已关闭或已由其他客服领取 }
  /customer-service/threads/{id}/transfer:
    post:
      summary: 转接会话给同店铺服务范围内的启用客服
      description: >-
        仅平台角色或当前领取客服可调用。请求必须包含每次操作唯一的
        X-Idempotency-Key；相同会话与幂等键重复提交返回同一转接结果，变更目标则返回冲突。
      security: [{ authorization: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: header, name: X-Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_admin_id, reason]
              properties:
                target_admin_id: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: 转接成功或同幂等键重试成功 }
        '400': { description: 目标客服未启用、无同店铺服务范围或参数错误 }
        '403': { description: 非平台且非当前领取客服，或无会话数据范围 }
        '409': { description: 会话已关闭、转给当前归属或幂等键被不同目标复用 }
  /customer-service/threads/{id}/assignment-logs:
    get:
      summary: 查询获授权会话的转接审计记录
      description: >-
        审计记录仅在会话所属店铺通过 service_queue 数据范围校验后返回；不返回调用方的幂等键。
      security: [{ authorization: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 转接审计分页，包含原客服、目标客服、操作人、原因和时间 }
        '403': { description: 无 customer_service 角色或无会话数据范围 }
        '404': { description: 会话不存在或不在当前数据范围 }
components:
  securitySchemes:
    authorization:
      type: apiKey
      in: header
      name: Authorization
      description: 唯一 JWT 请求头，格式 Bearer token。
