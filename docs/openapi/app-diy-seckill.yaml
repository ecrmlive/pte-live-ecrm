openapi: 3.0.3
info:
  title: pte-live-ecrm app diy & seckill
  version: 0.6.1
  description: |
    C 端 DIY 首页 + 秒杀列表。DIY 页面统一返回 `{page, items[]}` 组件文档；
    `/diy/home` 与 `/diy/pages/{id}` 只读取 qixi_crm_business 的发布投影，草稿不暴露给公共 C 端。
    请求带 `X-AppId` 时按该店铺读取；未知或关闭店铺返回 404。未带时仅读取平台发布页。
    秒杀公共展示只读取 qixi_crm_b_marketing_activity_view 与商品消费投影；
    配置规则内携带 product_id、seckill_price、time_slots。结算侧的秒杀计价、
    限购和券互斥必须由订单域在创建订单时再次校验，不能以本只读接口为准。
servers:
  - url: /api/app/v1
paths:
  /diy/home:
    get:
      summary: 平台或 X-AppId 店铺的启用装修首页（page / items[]）
      parameters:
        - name: X-AppId
          in: header
          required: false
          schema: { type: string }
          description: 店铺 AppId；省略为平台首页
  /diy/pages/{id}:
    get:
      summary: 已发布装修页详情（page / items[]）
      parameters:
        - name: X-AppId
          in: header
          required: false
          schema: { type: string }
          description: 店铺 AppId；省略为平台页面
  /seckill/times:
    get:
      summary: 当前已发布秒杀活动归集的场次（label / active）
  /seckill/actives:
    get:
      summary: 已发布且在活动有效期内的秒杀展示列表（含 in_window、time_slots、商品信息）
