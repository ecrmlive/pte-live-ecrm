openapi: 3.0.3
info:
  title: qixi-mergers app diy & seckill
  version: 0.6.1
  description: |
    C 端 DIY 首页 + 秒杀列表。DIY 页面统一返回 `{page, items[]}` 组件文档；
    `/diy/home` 仅返回当前范围已启用首页，`/diy/pages/{id}` 仅允许读取已启用且展示中的页面，草稿不暴露给公共 C 端。
    结算：v2 check/create 在场次内自动覆盖行价为 seckill_price；
    订单行 product_type=1、activity_id=seckill_active_id；单次限购 once_pay_count；
    秒杀清空店铺券（平台券仍可）。
servers:
  - url: /api/app/v1
paths:
  /diy/home:
    get:
      summary: 平台或指定商户的启用装修首页（page / items[]）
      parameters:
        - name: mer_id
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: 商户店铺首页；省略或 0 为平台首页
  /diy/pages/{id}:
    get:
      summary: 已发布装修页详情（page / items[]）
  /seckill/times:
    get:
      summary: 秒杀场次
  /seckill/actives:
    get:
      summary: 开启中的秒杀列表（含 in_window）
  /seckill/actives/{id}:
    get:
      summary: 秒杀详情
