openapi: 3.0.3
info:
  title: pte-live-ecrm merchant aftersale & finance
  version: 0.4.0
  description: |
    阶段 4 商户售后审核 + 提现申请（mer_id 隔离）。
    approve/reject 需按钮权限 path：order/refund/approve、order/refund/reject（menu_id 129/130）。
servers:
  - url: /api/merchant/v1
paths:
  /refunds:
    get:
      summary: 本店售后列表
  /refunds/{id}:
    get:
      summary: 售后详情
  /refunds/{id}/approve:
    post:
      summary: 审核通过售后（需 refund.approve）
      description: 仅退款进入 refunding；退货退款进入 awaiting_return，等待用户登记退货物流。不会把退款直接标记为已退款，资金到账只能由支付渠道的已验证回调确认。
  /refunds/{id}/reject:
    post:
      summary: 拒绝（status=-1；需 order/refund/reject）
  /refunds/{id}/confirm-return:
    post:
      summary: 确认收到退货（需 refund.approve）
      description: 仅适用于 awaiting_receipt 的退货退款；确认后进入 refunding，仍须等待支付渠道已验证回调。
  /finance/balance:
    get:
      summary: 店铺余额
  /finance/withdraw:
    post:
      summary: 申请提现（扣 mer_money）
  /finance/withdraws:
    get:
      summary: 提现列表
  /finance/withdraws/{id}:
    get:
      summary: 提现详情
