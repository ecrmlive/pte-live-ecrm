openapi: 3.0.3
info:
  title: qixi-live-ecrm manager trade
  version: 0.1.0
  description: 店铺员工登录 / 核销 / 代退（api-merchant `/api/manager/v1`）；JWT PortalManager，claims.admin_id=service_id
servers:
  - url: /api/manager/v1
paths:
  /ping:
    get:
      summary: 店员端接口健康探测
  /auth/login:
    post:
      summary: 店员登录（旧契约迁移参考；店员数据归属 qixi_crm_m_）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, example: staff1 }
                password: { type: string, format: password, example: admin123 }
      responses:
        '200':
          description: OK（token + user：service_id/mer_id/mer_name/account/nickname/is_verify）
  /auth/refresh:
    post:
      summary: 刷新 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: 当前店员资料
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: '{service_id, mer_id, mer_name, account, nickname, is_verify}'
  /orders:
    get:
      summary: 本店订单列表
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: paid, in: query, schema: { type: integer } }
        - name: await_verify
          in: query
          description: =1 时 paid=1 且 status IN (0,1,2)
          schema: { type: integer, enum: [1] }
      responses:
        '200':
          description: OK
  /orders/code/{code}:
    get:
      summary: 按核销码查本店订单
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
  /orders/{id}:
    get:
      summary: 订单详情
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
  /orders/{id}/verify:
    post:
      summary: 核销（需 is_verify=1）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verify_code: { type: string, description: 订单有码时必填匹配；空码仅校验 mer_id+paid }
      responses:
        '200':
          description: OK（已完成幂等成功）
        '403':
          description: 无核销权限
  /orders/{id}/delivery:
    post:
      summary: 发货（物流）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_name, delivery_id]
              properties:
                delivery_name: { type: string }
                delivery_id: { type: string }
                delivery_type: { type: string, default: express }
      responses:
        '200':
          description: OK
  /refunds:
    get:
      summary: 本店售后列表
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
    post:
      summary: 店员代用户申请仅退款
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, refund_message, refund_type]
              properties:
                order_id: { type: integer }
                refund_message: { type: string }
                refund_type: { type: integer, enum: [1], description: 仅退款 }
      responses:
        '200':
          description: OK
  /refunds/{id}/approve:
    post:
      summary: 同意仅退款（需 is_verify=1）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
        '403':
          description: 无核销权限
  /refunds/{id}/reject:
    post:
      summary: 拒绝仅退款（需 is_verify=1 和 fail_message）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fail_message]
              properties:
                fail_message: { type: string }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
