openapi: 3.0.3
info:
  title: qixi-mergers app content
  version: 0.7.8
  description: >-
    PC、小程序、H5、iOS、Android、鸿蒙共用的内容消费视图；公告和协议只读取
    qixi_crm_b_content_view 的已发布记录，C 端不读取后台内容表。
servers:
  - url: /api/app/v1
paths:
  /notices:
    get:
      summary: 公告列表
  /notices/{id}:
    get:
      summary: 公告详情（未展示返回 404）
  /agreements/{key}:
    get:
      summary: 协议正文（白名单键）
  /articles:
    get:
      summary: 已发布文章列表
  /articles/{id}:
    get:
      summary: 已发布文章详情
  /article/categories:
    get:
      summary: 文章分类列表
