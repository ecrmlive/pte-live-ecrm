openapi: 3.0.3
info:
  title: qixi-live-ecrm platform setting
  version: 0.7.1
  description: 平台设置最小 CRUD（管理员/区域管理员绑定/角色/菜单）
servers:
  - url: /api/platform/v1
paths:
  /setting/admins:
    get:
      summary: 管理员列表
    post:
      summary: 新建管理员；is_agent=1 时必须提供 region_ids（商户 region_id 逗号分隔）
  /setting/admins/{id}:
    put:
      summary: 更新管理员（含区域范围、启停、改密）
  /setting/roles:
    get:
      summary: 角色列表
    post:
      summary: 新建平台或区域角色（可用 menu_ids 勾选；区域角色传 is_agent=1、circle_id）
  /setting/roles/{id}:
    put:
      summary: 更新角色名/menu_ids/启停
  /setting/menus:
    get:
      summary: 菜单列表（含隐藏项）
  /setting/menus/tree:
    get:
      summary: 菜单树（角色勾选用）
  /setting/menus/{id}:
    put:
      summary: 更新名称/排序/显示
  /setting/sms:
    get:
      summary: 短信配置
    put:
      summary: 更新短信配置
  /setting/cloud-configs:
    get:
      summary: 获取平台云服务配置分组
      description: 返回支付、腾讯云、COS、LVB、VOD、License、回调与 IM 配置。密钥字段始终以掩码返回。
      responses:
        '200':
          description: 配置分组列表
  /setting/cloud-configs/{group}:
    get:
      summary: 获取指定云服务配置分组
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum: [payment, tencent_account, cos, lvb, vod, live_license, lvb_callback, im]
    put:
      summary: 加密保存指定云服务配置分组
      description: 需要平台“保存云服务配置”权限。密钥字段传空或掩码会保留原密钥，其他值使用 AES-GCM 加密保存。
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: 已保存的配置分组（密钥为掩码）
        '400':
          description: 分组、字段或值不合法
