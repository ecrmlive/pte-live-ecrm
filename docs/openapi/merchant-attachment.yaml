openapi: 3.0.3
info:
  title: qixi-mergers merchant attachment
  version: 0.7.5
  description: 商户素材库；分类创建/编辑与上传需 attachment/upload，删除需 attachment/delete。所有数据按 mer_id 隔离，删除分类时素材保留并归入未分类。
servers:
  - url: /api/merchant/v1
paths:
  /attachments/categories:
    get:
      summary: 本店分类列表
    post:
      summary: 创建分类
  /attachments/categories/{id}:
    put:
      summary: 更新分类
    delete:
      summary: 删除分类（按钮权 attachment/delete）
  /attachments:
    get:
      summary: 本店素材列表（category_id、type=image|video 可选）
  /attachments/upload:
    post:
      summary: multipart 上传图片（最大 5MB）或视频（mp4/mov/webm，最大 100MB；按钮权 attachment/upload；存储优先使用数据库 COS 配置）
  /attachments/{id}:
    delete:
      summary: 删除本店素材（按钮权 attachment/delete）
