openapi: 3.0.3
info:
  title: qixi-mergers merchant live
  version: 0.7.5
  description: >-
    商户直播间 CRUD + 挂货；create/delete/live/goods 分别需
    broadcast/create|delete|live|goods
servers:
  - url: /api/merchant/v1
paths:
  /broadcast/rooms:
    get:
      summary: 本店直播间
    post:
      summary: 创建直播间（按钮权 broadcast/create）
  /broadcast/rooms/{id}:
    get:
      summary: 详情
    put:
      summary: 更新（改 live_status 需 broadcast/live；改 product_ids 需 broadcast/goods）
    delete:
      summary: 软删（按钮权 broadcast/delete）
  /broadcast/rooms/{id}/goods:
    put:
      summary: 设置挂货商品（按钮权 broadcast/goods）
