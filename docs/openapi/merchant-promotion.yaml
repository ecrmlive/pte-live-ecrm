openapi: 3.0.3
info:
  title: pte-live-ecrm merchant promotion
  version: 0.8.0
  description: 商户店铺券；创建、启停、删除、定向发券均由商户权限与 mer_id 隔离保护。
servers:
  - url: /api/merchant/v1
paths:
  /coupons:
    get:
      summary: 本店券列表（mer_id 隔离）
    post:
      summary: 创建店铺券（按钮权 coupon/create）
  /coupons/{id}:
    put:
      summary: 更新店铺券
    delete:
      summary: 软删除店铺券（按钮权 coupon/delete）
  /coupons/{id}/status:
    post:
      summary: 启停店铺券（按钮权 coupon/toggle）
  /coupons/{id}/send:
    post:
      summary: 向本商户已支付订单用户定向发券（按钮权 merchantCouponSendCoupon）
  /coupons/records:
    get:
      summary: 店铺券领取、发送及使用记录（按 mer_id 隔离）
  /coupons/sends:
    get:
      summary: 定向发券批次记录（按 mer_id 隔离）
