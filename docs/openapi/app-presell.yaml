openapi: 3.0.3
info:
  title: qixi-mergers app presell
  version: 0.6.5
  description: C 端预售（activity_type=2）；全款 + 定金尾款（status=10/11，POST /presell/pay/:id）
servers:
  - url: /api/app/v1
paths:
  /presell/actives:
    get:
      summary: 进行中的预售列表（全款/定金）
  /presell/actives/{id}:
    get:
      summary: 预售详情
  /order/presell/check:
    post:
      summary: 预售核价（定金首期=down_price）
  /order/presell/create:
    post:
      summary: 创建预售单（全款或定金首付）
  /presell/finals:
    get:
      summary: 我的尾款单列表
  /presell/finals/{id}:
    get:
      summary: 尾款单详情
  /presell/pay/{id}:
    post:
      summary: 支付尾款（type=mock|balance）；成功后订单 status 10→0
  /order/presell/final/pay/{id}:
    post:
      summary: 支付尾款兼容入口（与 /presell/pay/{id} 语义一致）
