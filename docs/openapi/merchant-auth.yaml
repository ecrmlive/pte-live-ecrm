openapi: 3.0.3
info:
  title: qixi-mergers merchant auth
  version: 0.7.3
  description: 商户后台身份；JWT 强制含 mer_id；阶段 7 增加按钮权限列表
servers:
  - url: /api/merchant/v1
paths:
  /auth/login:
    post:
      summary: 商户管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
  /auth/refresh:
    post:
      summary: 刷新 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: 当前商户管理员（含 mer_id）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/menus:
    get:
      summary: 商户菜单树（仅 is_menu=1）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/permissions:
    get:
      summary: 按钮权限 path 列表（如 order/deliver、order/verify）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/password:
    put:
      summary: 修改密码
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
