openapi: 3.0.3
info:
  title: 七禧店铺后台认证 API
  version: 1.0.0
  description: >-
    api-merchant 独立店铺认证。JWT 强制包含 scope=store_console、merchant_id、store_id、store_app_id
    与店铺角色，账号只读取 qixi_crm_m_account。受保护接口必须同时使用 Authori-zation 和 X-AppId。
servers:
  - url: /api/merchant/v1
paths:
  /auth/login:
    post:
      summary: 店铺账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: OK
  /auth/refresh:
    post:
      summary: 通过 Authori-zation 头的 refresh token 刷新 access token
      security: [{ qixiJWT: [] }]
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      summary: 当前店铺账号（含 merchant_id、store_id、store_app_id）
      security: [{ qixiJWT: [] }]
      responses:
        '200':
          description: OK
  /auth/menus:
    get:
      summary: 按店铺角色返回菜单树
      security: [{ qixiJWT: [] }]
      responses:
        '200':
          description: OK
  /auth/permissions:
    get:
      summary: 店铺角色权限代码列表
      security: [{ qixiJWT: [] }]
      responses:
        '200':
          description: OK
  /auth/password:
    put:
      summary: 修改密码
      security: [{ qixiJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    qixiJWT:
      type: apiKey
      in: header
      name: Authori-zation
      description: "Bearer <JWT>；所有受保护店铺接口另需 X-AppId，且必须与 token.store_app_id 一致。"
  schemas:
    StoreProfile:
      type: object
      required: [merchant_admin_id, mer_id, store_id, store_app_id, mer_name, store_name, account, roles]
      properties:
        merchant_admin_id: { type: integer, format: int64, description: 店铺账号 ID }
        mer_id: { type: integer, format: int64, description: 商户 ID }
        store_id: { type: integer, format: int64, description: 店铺 ID }
        store_app_id: { type: string, description: 店铺 X-AppId }
        mer_name: { type: string }
        store_name: { type: string }
        account: { type: string }
        real_name: { type: string }
        phone: { type: string }
        roles: { type: string, enum: [owner, manager, clerk, delivery, service] }
