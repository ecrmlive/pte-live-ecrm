# 后台 API（api-admin）主配置；pack 同步到 release/qixi-mergers-api-admin/config/{local,prod}/app.yaml
# MySQL/Redis/NATS/etcd：pte-live-im 共享基建。对象存储：腾讯云 COS（不用 MinIO）。
server:
  addr: ":8080"
  mode: debug

mysql:
  dsn: "qixi:qixi_local@tcp(pte_live_mysql:3306)/qixi_mergers?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "pte_live_redis:6379"
  password: ""
  db: 0

nats:
  url: "nats://pte_live_nats1:4222,nats://pte_live_nats2:4222,nats://pte_live_nats3:4222"

etcd:
  endpoints:
    - "pte_live_etcd1:2379"
    - "pte_live_etcd2:2379"
    - "pte_live_etcd3:2379"

cos:
  enabled: true
  bucket: ""          # 或环境变量 QIXI_COS_BUCKET
  region: "ap-guangzhou"
  secret_id: ""       # 或 QIXI_COS_SECRET_ID（勿提交真实密钥）
  secret_key: ""      # 或 QIXI_COS_SECRET_KEY
  base_url: "https://cos.qxkejiwl.top/qixi-mergers"
  key_prefix: "qixi-mergers"

jwt:
  secret: "qixi-mergers-dev-jwt-secret-change-me"
  access_ttl_hours: 12
  refresh_ttl_hours: 168

upload:
  dir: "data/uploads"
  public_base: "/uploads"

im:
  mode: remote
  api_base: "http://pte_live_api_im:11504"
  ws_public_url: "ws://127.0.0.1:11510/ws"
  app_id: "30001"
  integration_token: ""
