<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>栖息商城 · 客服工作台</title>
  <style>
    :root { --bg: #f4f6f8; --card: #fff; --line: #e6e8eb; --text: #1f2329; --muted: #8a8f98; --accent: #1677ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    p.sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    main { max-width: 980px; margin: 24px auto; padding: 0 16px 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 14px; }
    button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); margin-left: 8px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; overflow: auto; font-size: 12px; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .replies button { background: #f0f5ff; color: #1d39c4; border: 1px solid #adc6ff; margin: 0; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; }
    .thread { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .thread.active { border-color: var(--accent); background: #f0f5ff; }
    .thread .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .msgs { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .msg { margin-bottom: 10px; font-size: 13px; }
    .msg .who { color: var(--muted); font-size: 11px; }
    .msg.service .bubble { background: #e6f4ff; }
    .msg.user .bubble { background: #fff; border: 1px solid var(--line); }
    .bubble { display: inline-block; padding: 8px 10px; border-radius: 8px; margin-top: 2px; max-width: 90%; word-break: break-word; }
    .hidden { display: none; }
    @media (max-width: 800px) { .row, .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>客服工作台</h1>
      <p class="sub">JWT · 查单 · 快捷回复 · 本仓会话元数据 · PTE Web SDK E2EE 密聊</p>
    </div>
    <div id="userBar" class="hidden"><span id="userLabel"></span>
      <span id="wsStatus" style="margin:0 12px;font-size:12px;color:var(--muted)">IM: 未连接</span>
      <button class="secondary" id="btnLogout" type="button">退出</button>
    </div>
  </header>
  <main>
    <div class="card" id="loginCard">
      <div class="row">
        <div>
          <label>API 根（api-admin）</label>
          <input id="base" value="http://127.0.0.1:18080" />
        </div>
        <div>
          <label>账号（staff1 / admin123）</label>
          <input id="account" value="staff1" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>密码</label>
          <input id="password" type="password" value="admin123" />
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:12px;">
          <button id="btnLogin" type="button">登录客服</button>
        </div>
      </div>
    </div>

    <div id="work" class="hidden">
      <div class="card">
        <div class="row">
          <div>
            <label>订单 order_id</label>
            <input id="orderId" value="1" />
          </div>
          <div style="display:flex;align-items:flex-end;padding-bottom:12px;gap:8px;">
            <button id="btnOrder" type="button">查单</button>
            <button class="secondary" id="btnReplies" type="button">快捷回复</button>
            <button class="secondary" id="btnCred" type="button">IM 凭证</button>
            <button class="secondary" id="btnWS" type="button">连接 IM SDK</button>
          </div>
        </div>
        <div class="replies" id="replyBox"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <strong>会话</strong>
          <button class="secondary" id="btnThreads" type="button">刷新列表</button>
        </div>
        <div class="layout">
          <div id="threadList"></div>
          <div>
            <div class="msgs" id="msgBox">选择左侧会话</div>
            <textarea id="msgText" rows="3" placeholder="输入回复…"></textarea>
            <button id="btnSend" type="button" disabled>发送</button>
            <button class="secondary" id="btnClaim" type="button" disabled>承接会话</button>
          </div>
        </div>
      </div>

      <div class="card">
        <label>输出</label>
        <pre id="out">已登录，可查单 / 会话…</pre>
      </div>
    </div>
  </main>
  <script type="module">
    import { PteLiveIMWebClient } from "./pte-im-web-sdk.js";

    const $ = (id) => document.getElementById(id);
    const out = (v) => { $("out").textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2); };
    const state = { token: localStorage.getItem("svc_access") || "", refresh: localStorage.getItem("svc_refresh") || "", user: null, threadId: 0, im: null, cred: null };
    function setWSStatus(text, ok) {
      const el = $("wsStatus");
      if (!el) return;
      el.textContent = "IM: " + text;
      el.style.color = ok ? "#389e0d" : "var(--muted)";
    }

    function base() { return $("base").value.replace(/\/$/, ""); }
    function authHeaders() {
      return { "Authorization": "Bearer " + state.token, "Content-Type": "application/json" };
    }
    function showWork(user) {
      state.user = user;
      $("loginCard").classList.add("hidden");
      $("work").classList.remove("hidden");
      $("userBar").classList.remove("hidden");
      $("userLabel").textContent = (user?.nickname || user?.account || "") + " · mer " + (user?.mer_id || "");
    }
    function logout() {
      if (state.im) { try { state.im.stop(); } catch (_) {} }
      state.token = ""; state.refresh = ""; state.user = null; state.threadId = 0; state.im = null; state.cred = null;
      localStorage.removeItem("svc_access"); localStorage.removeItem("svc_refresh");
      $("loginCard").classList.remove("hidden");
      $("work").classList.add("hidden");
      $("userBar").classList.add("hidden");
      setWSStatus("未连接", false);
    }

    async function api(path, opts = {}) {
      const res = await fetch(base() + path, opts);
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || json.msg || ("HTTP " + res.status));
      return json.data !== undefined ? json : json;
    }

    $("btnLogin").onclick = async () => {
      try {
        const res = await api("/api/service/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account: $("account").value, password: $("password").value }),
        });
        const data = res.data || res;
        state.token = data.token.access_token;
        state.refresh = data.token.refresh_token;
        localStorage.setItem("svc_access", state.token);
        localStorage.setItem("svc_refresh", state.refresh);
        showWork(data.user);
        out(data);
        await loadThreads();
      } catch (e) { out(String(e)); }
    };

    $("btnLogout").onclick = logout;

    $("btnOrder").onclick = async () => {
      try {
        const res = await api(`/api/service/v1/orders/${$("orderId").value}`, { headers: authHeaders() });
        out(res.data || res);
      } catch (e) { out(String(e)); }
    };

    $("btnReplies").onclick = async () => {
      try {
        const res = await api("/api/service/v1/quick-replies", { headers: authHeaders() });
        const data = res.data || res;
        out(data);
        const box = $("replyBox");
        box.innerHTML = "";
        (data.list || []).forEach((item) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = item.title || item.keyword;
          b.onclick = () => { $("msgText").value = item.content; };
          box.appendChild(b);
        });
      } catch (e) { out(String(e)); }
    };

    $("btnCred").onclick = async () => {
      try {
        const q = state.threadId ? `?thread_id=${state.threadId}` : "";
        const res = await api("/api/service/v1/im/credential" + q, { headers: authHeaders() });
        state.cred = res.data || res;
        out(state.cred);
      } catch (e) { out(String(e)); }
    };

    $("btnWS").onclick = async () => {
      try {
        if (state.im) { try { state.im.stop(); } catch (_) {} state.im = null; }
        const q = state.threadId ? `?thread_id=${state.threadId}` : "";
        const res = await api("/api/service/v1/im/credential" + q, { headers: authHeaders() });
        const cred = res.data || res;
        state.cred = cred;
        if (cred.mode !== "remote" || !cred.ws_url || !cred.api_url || !cred.user_sig || !cred.sdk_app_id) {
          setWSStatus("需 im.mode=remote + api_url/ws/UserSig", false);
          out(cred);
          return;
        }
        setWSStatus("连接中…", false);
        const client = new PteLiveIMWebClient({
          provider: "pte-live-im",
          apiUrl: String(cred.api_url).replace(/\/$/, ""),
          wsUrl: String(cred.ws_url).replace(/\/$/, ""),
          sdkAppId: String(cred.sdk_app_id),
          identifier: String(cred.identifier || cred.im_user_id),
          userSig: String(cred.user_sig),
          userId: String(cred.identifier || cred.im_user_id),
          expireAt: Number(cred.expire_at || 0),
        });
        client.addListener({
          onConnectionChanged: (ok) => setWSStatus(ok ? "已连接" : "已断开", ok),
          onMessage: (m) => out({ im_message: m }),
          onError: (msg) => out({ im_error: msg }),
        });
        await client.start();
        state.im = client;
        out({
          connected: true,
          conversation_id: cred.im_conversation_id,
          note: cred.note,
          sdk: "PteLiveIMWebClient",
        });
      } catch (e) {
        setWSStatus("失败", false);
        out(String(e));
      }
    };

    async function loadThreads() {
      const res = await api("/api/service/v1/threads", { headers: authHeaders() });
      const data = res.data || res;
      const box = $("threadList");
      box.innerHTML = "";
      (data.list || []).forEach((t) => {
        const el = document.createElement("div");
        el.className = "thread" + (t.thread_id === state.threadId ? " active" : "");
        el.innerHTML = `<div>${t.user_nickname || ("用户 " + t.uid)}</div><div class="meta">${t.last_msg || ""} · 未读 ${t.service_unread || 0}</div>`;
        el.onclick = () => selectThread(t.thread_id);
        box.appendChild(el);
      });
      if (!(data.list || []).length) box.innerHTML = "<div class='meta'>暂无会话（用户端 POST /cs/threads 后出现）</div>";
    }

    async function selectThread(id) {
      state.threadId = id;
      $("btnSend").disabled = false;
      $("btnClaim").disabled = false;
      await loadThreads();
      const res = await api(`/api/service/v1/threads/${id}/messages?limit=50`, { headers: authHeaders() });
      const data = res.data || res;
      const box = $("msgBox");
      box.innerHTML = "";
      (data.list || []).forEach((m) => {
        const d = document.createElement("div");
        d.className = "msg " + (m.sender_role || "");
        d.innerHTML = `<div class="who">${m.sender_role} #${m.sender_id} · ${m.create_time || ""}</div><div class="bubble">${m.content}</div>`;
        box.appendChild(d);
      });
      box.scrollTop = box.scrollHeight;
    }

    $("btnThreads").onclick = async () => {
      try { await loadThreads(); out("会话已刷新"); } catch (e) { out(String(e)); }
    };

    $("btnClaim").onclick = async () => {
      try {
        const res = await api(`/api/service/v1/threads/${state.threadId}/claim`, { method: "POST", headers: authHeaders() });
        out(res.data || res);
      } catch (e) { out(String(e)); }
    };

    $("btnSend").onclick = async () => {
      try {
        const content = $("msgText").value.trim();
        if (!content) return;
        if (!state.im) {
          out("请先点击「连接 IM SDK」");
          return;
        }
        let convId = Number(state.cred && state.cred.im_conversation_id) || 0;
        if (!convId) {
          const q = `?thread_id=${state.threadId}`;
          const res = await api("/api/service/v1/im/credential" + q, { headers: authHeaders() });
          state.cred = res.data || res;
          convId = Number(state.cred.im_conversation_id) || 0;
        }
        if (!convId) {
          out("缺少 im_conversation_id，请先 claim 会话并确保 remote IM 可用");
          return;
        }
        const clientMsgId = await state.im.sendText(convId, content);
        $("msgText").value = "";
        const box = $("msgBox");
        const d = document.createElement("div");
        d.className = "msg service";
        d.innerHTML = `<div class="who">service · PTE E2EE</div><div class="bubble">${content}</div>`;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        out({ sent: true, clientMsgId, conversationId: convId, via: "pte-im-sdk" });
      } catch (e) { out(String(e)); }
    };

    (async () => {
      if (!state.token) return;
      try {
        const res = await api("/api/service/v1/auth/me", { headers: authHeaders() });
        showWork(res.data || res);
        await loadThreads();
      } catch (_) { logout(); }
    })();
  </script>
</body>
</html>
