name: ECRM
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    PRODUCT_BUNDLE_IDENTIFIER: com.qixi.ecrm.ios
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 七禧商城
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_ECRMAPIBaseURL: https://api.example.invalid/
    INFOPLIST_KEY_ECRMLogNetwork: YES
packages:
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: 2.6.0
targets:
  ECRM:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: ECRM
    dependencies:
      - package: Factory
    settings:
      base:
        PRODUCT_NAME: ECRM
        PRODUCT_BUNDLE_IDENTIFIER: com.qixi.ecrm.ios
    scheme:
      testTargets:
        - ECRMTests
  ECRMTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: ECRMTests
    dependencies:
      - target: ECRM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qixi.ecrm.ios.tests
        GENERATE_INFOPLIST_FILE: YES
